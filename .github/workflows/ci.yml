name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck · build · security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Security sinks
        run: bun run check:security

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Audit dependencies
        run: bun audit
        continue-on-error: true

      - name: Verify build artifacts
        run: test -f dist/index.js && test -f dist/cli/bin.js && test -f dist/ui/styles.bundled.css
