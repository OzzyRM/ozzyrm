name: Bug report
description: Report a defect in ozzyrm
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities: **do not** use this form — see [SECURITY.md](../../SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OzzyRM version
      placeholder: "0.3.2"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI (generate / watch / serve)
        - Catalog / unified / scenarios
        - Parsers (Prisma / Drizzle / SQL)
        - React / UI
        - Docs / website
        - Other
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps or config snippet
      render: typescript
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
